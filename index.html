    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>@font-face { font-family: Geist; font-style: normal; font-weight: 400 700; font-display: swap; src: url('/fonts/geist-latin.woff2') format('woff2'); }</style>
    <meta property="og:type" content="website" />

    <link rel="canonical" href="https://momong.evanyudis.com/" />
    <title>Momong</title>
    <script>
      // Set theme before first paint (no flash on refresh).
      try {
        var t = (JSON.parse(localStorage.getItem("bb_prefs_v1")) || {}).theme;
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.theme = "dark";
        document.querySelector('meta[name="theme-color"]').content = document.documentElement.dataset.theme === "dark" ? "#141414" : "#fafafa";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
